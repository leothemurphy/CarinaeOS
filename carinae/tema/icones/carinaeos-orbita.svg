<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23356e"/>
      <stop offset="0.55" stop-color="#2a1d5a"/>
      <stop offset="1" stop-color="#140c2a"/>
    </linearGradient>
    <radialGradient id="planeta" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffe1bd"/>
      <stop offset="0.45" stop-color="#ffb46e"/>
      <stop offset="1" stop-color="#d9486f"/>
    </radialGradient>
    <linearGradient id="anel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".15"/>
    </linearGradient>
    <clipPath id="frente"><rect x="0" y="134" width="256" height="122"/></clipPath>
    <clipPath id="forma"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#fundo)"/>
  <g clip-path="url(#forma)">
    <g fill="#fff">
      <circle cx="46" cy="58" r="1.6" opacity=".7"/><circle cx="206" cy="42" r="1.3" opacity=".6"/>
      <circle cx="210" cy="206" r="1.7" opacity=".6"/><circle cx="58" cy="208" r="1.2" opacity=".5"/>
    </g>
    <!-- parte de tras do anel -->
    <ellipse cx="128" cy="134" rx="98" ry="30" fill="none" stroke="url(#anel)" stroke-width="7" transform="rotate(-18 128 134)" opacity=".55"/>
    <!-- planeta (saco de compras estilizado: alca no topo) -->
    <circle cx="128" cy="134" r="56" fill="url(#planeta)"/>
    <path d="M106 104 C106 84 150 84 150 104" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".92"/>
    <!-- frente do anel -->
    <g transform="rotate(-18 128 134)">
      <ellipse cx="128" cy="134" rx="98" ry="30" fill="none" stroke="url(#anel)" stroke-width="7" clip-path="url(#frente)"/>
    </g>
    <!-- estrela em orbita -->
    <path d="M206 92 C207 101 210 104 219 105 C210 106 207 109 206 118 C205 109 202 106 193 105 C202 104 205 101 206 92Z" fill="#fff"/>
  </g>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
