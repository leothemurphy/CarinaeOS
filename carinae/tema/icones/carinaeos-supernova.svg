<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="fundo" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#3a1d52"/>
      <stop offset="0.55" stop-color="#1b0f2b"/>
      <stop offset="1" stop-color="#0b0712"/>
    </radialGradient>
    <radialGradient id="nucleo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#fff1dc"/>
      <stop offset="0.55" stop-color="#ffb46e"/>
      <stop offset="1" stop-color="#ff6f91" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="raio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6f91" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd3a8"/>
      <stop offset="1" stop-color="#ff6f91" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="onda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6f91"/>
      <stop offset="1" stop-color="#ffb46e"/>
    </linearGradient>
    <clipPath id="forma"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#fundo)"/>
  <g clip-path="url(#forma)">
    <!-- poeira de estrelas -->
    <g fill="#fff">
      <circle cx="52" cy="60" r="1.6" opacity=".7"/><circle cx="200" cy="48" r="1.4" opacity=".6"/>
      <circle cx="214" cy="190" r="1.8" opacity=".7"/><circle cx="44" cy="196" r="1.3" opacity=".5"/>
      <circle cx="176" cy="214" r="1.2" opacity=".5"/><circle cx="76" cy="30" r="1.1" opacity=".5"/>
    </g>
    <!-- onda de choque -->
    <ellipse cx="128" cy="128" rx="86" ry="86" fill="none" stroke="url(#onda)" stroke-width="5" opacity=".55" stroke-dasharray="60 22 14 22"/>
    <ellipse cx="128" cy="128" rx="104" ry="104" fill="none" stroke="#ffb46e" stroke-width="2" opacity=".22"/>
    <!-- raios -->
    <g transform="translate(128 128)">
      <rect x="-5" y="-108" width="10" height="216" rx="5" fill="url(#raio)"/>
      <rect x="-5" y="-108" width="10" height="216" rx="5" fill="url(#raio)" transform="rotate(90)"/>
      <rect x="-3" y="-78" width="6" height="156" rx="3" fill="url(#raio)" transform="rotate(45)" opacity=".85"/>
      <rect x="-3" y="-78" width="6" height="156" rx="3" fill="url(#raio)" transform="rotate(-45)" opacity=".85"/>
    </g>
    <!-- nucleo -->
    <circle cx="128" cy="128" r="58" fill="url(#nucleo)"/>
    <path d="M128 92 C131 118 138 125 164 128 C138 131 131 138 128 164 C125 138 118 131 92 128 C118 125 125 118 128 92Z" fill="#fff"/>
    <!-- faisca -->
    <path d="M188 70 C189 78 191 80 199 81 C191 82 189 84 188 92 C187 84 185 82 177 81 C185 80 187 78 188 70Z" fill="#fff4e6"/>
  </g>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
