name: Compilar o Pórtico (Linux, Windows e Mac)

# Compila o navegador de verdade, com nome e ícone do Pórtico, a partir do
# código do Firefox ESR. Leva de 2 a 5 horas. Os jobs de Windows e Mac são
# experimentais: se falharem, o de Linux continua e é publicado.
on:
  workflow_dispatch:
  push:
    tags: ["portico-v*"]
    branches: ["construir/portico"]

permissions:
  contents: write

jobs:
  fonte:
    name: Preparar o código com a marca do Pórtico
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
      - name: Descobrir a versão ESR atual
        id: v
        run: |
          V=$(curl -fsSL https://product-details.mozilla.org/1.0/firefox_versions.json | jq -r .FIREFOX_ESR)
          echo "versao=$V" >> "$GITHUB_OUTPUT"; echo "Versão: $V"
      - name: Baixar o código e aplicar a marca
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick icnsutils
          V=${{ steps.v.outputs.versao }}
          curl -fL "https://archive.mozilla.org/pub/firefox/releases/$V/source/firefox-$V.source.tar.xz" -o fonte.tar.xz
          mkdir src && tar -xJf fonte.tar.xz -C src --strip-components=1 && rm fonte.tar.xz
          bash portico/compilar/marca.sh "$PWD/src" "$PWD/portico"
          cp portico/compilar/mozconfig src/mozconfig
          mkdir -p extras
          for L in pt-PT pt-BR; do
            curl -fL "https://archive.mozilla.org/pub/firefox/releases/$V/linux-x86_64/xpi/$L.xpi" -o "extras/langpack-$L@firefox.mozilla.org.xpi"
          done
          tar -cf - src | zstd -T0 -3 -o src.tar.zst
      - uses: actions/upload-artifact@v4
        with: { name: fonte, path: "src.tar.zst\nextras/", retention-days: 3, compression-level: 0 }

  linux:
    name: Linux (x86_64)
    needs: fonte
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Liberar espaço e criar memória extra (swap)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h; df -h /
      - uses: actions/download-artifact@v4
        with: { name: fonte }
      - name: Compilar
        run: |
          zstd -dc src.tar.zst | tar -xf - && rm src.tar.zst
          cd src
          ./mach --no-interactive bootstrap --application-choice browser
          ./mach build
          ./mach package
      - name: Empacotar
        run: |
          V=${{ needs.fonte.outputs.versao }}
          PKG=$(ls src/obj-portico/dist/portico-*.tar.* | head -1)
          mkdir pk && tar -xf "$PKG" -C pk
          mkdir -p pk/portico/distribution/extensions && cp extras/*.xpi pk/portico/distribution/extensions/
          cd pk && tar -cJf "../Portico-$V-linux-x86_64.tar.xz" portico
      - uses: actions/upload-artifact@v4
        with: { name: portico-linux, path: "Portico-*.tar.xz", retention-days: 14 }

  windows:
    name: Windows (x64) — experimental
    needs: fonte
    runs-on: windows-latest
    timeout-minutes: 350
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with: { name: fonte }
      - name: Instalar o MozillaBuild
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile mb.exe
          Start-Process .\mb.exe -ArgumentList '/S' -Wait
      - name: Compilar
        shell: cmd
        run: |
          set MOZILLABUILD=C:\mozilla-build\
          C:\mozilla-build\msys2\usr\bin\bash.exe -l -c "cd \"$(cygpath '%GITHUB_WORKSPACE%')\" && zstd -dc src.tar.zst | tar -xf - && rm src.tar.zst && cd src && ./mach --no-interactive bootstrap --application-choice browser && ./mach build && ./mach package"
      - name: Empacotar
        shell: pwsh
        run: |
          $V = '${{ needs.fonte.outputs.versao }}'
          $zip = Get-ChildItem src\obj-portico\dist\portico-*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath pk
          New-Item -ItemType Directory -Force pk\portico\distribution\extensions | Out-Null
          Copy-Item extras\*.xpi pk\portico\distribution\extensions\
          Compress-Archive -Path pk\portico -DestinationPath "Portico-$V-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: portico-windows, path: "Portico-*.zip", retention-days: 14 }

  mac:
    name: macOS ${{ matrix.nome }} — experimental
    needs: fonte
    runs-on: macos-14
    timeout-minutes: 350
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: "Intel", arq: x86_64, alvo: "x86_64-apple-darwin" }
          - { nome: "Apple Silicon", arq: arm64, alvo: "aarch64-apple-darwin" }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: fonte }
      - name: Compilar
        run: |
          brew install zstd || true
          zstd -dc src.tar.zst | tar -xf - && rm src.tar.zst
          cd src
          echo "ac_add_options --target=${{ matrix.alvo }}" >> mozconfig
          ./mach --no-interactive bootstrap --application-choice browser
          rustup target add ${{ matrix.alvo }} || "$HOME/.cargo/bin/rustup" target add ${{ matrix.alvo }}
          ./mach build
          ./mach package
      - name: Empacotar
        run: |
          V=${{ needs.fonte.outputs.versao }}
          DMG=$(ls src/obj-portico/dist/*.dmg | head -1)
          MNT=$(hdiutil attach -nobrowse -readonly "$DMG" | awk -F'\t' '/\/Volumes\//{print $NF}')
          mkdir pk && cp -R "$MNT"/*.app pk/ && hdiutil detach "$MNT"
          APP=$(ls -d pk/*.app | head -1)
          mkdir -p "$APP/Contents/Resources/distribution/extensions" && cp extras/*.xpi "$APP/Contents/Resources/distribution/extensions/"
          codesign --force --deep --sign - "$APP"
          hdiutil create -volname "Pórtico" -srcfolder pk -ov -format UDZO "Portico-$V-macos-${{ matrix.arq }}.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: "portico-mac-${{ matrix.arq }}", path: "Portico-*.dmg", retention-days: 14 }

  publicar:
    name: Publicar
    needs: [fonte, linux, windows, mac]
    if: always() && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "portico-*", merge-multiple: true, path: out }
      - run: ls -lh out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: portico-${{ needs.fonte.outputs.versao }}-${{ github.run_number }}
          name: Pórtico (motor ${{ needs.fonte.outputs.versao }}) — teste ${{ github.run_number }}
          prerelease: true
          files: out/*
          body: |
            **Pórtico**: navegador do AtriumOS compilado com nome e ícone próprios (motor Gecko ${{ needs.fonte.outputs.versao }}).

            - **Linux:** baixe o `.tar.xz`, descompacte e abra `portico/portico`.
            - **Windows:** baixe o `.zip`, descompacte e abra `portico\portico.exe` (se o Windows avisar: *Mais informações › Executar assim mesmo*).
            - **Mac:** use o `.dmg` **x86_64** em Macs Intel e o **arm64** em Macs M1/M2/M3/M4. Abra o `.dmg` e arraste o Pórtico para Aplicativos. Na primeira vez: Ajustes do Sistema › Privacidade e Segurança › *Abrir mesmo assim*.

            Ainda sem assinatura digital e sem atualização automática: é uma versão de teste.
