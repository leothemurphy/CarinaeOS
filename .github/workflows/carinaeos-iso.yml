# CarinaeOS - gera a ISO (Debian 13 + KDE Plasma + visual CarinaeOS) nos
# servidores do GitHub e publica-a como "release" (em partes de 1,9 GB, porque o
# GitHub nao aceita ficheiros maiores do que 2 GB).
# Correr: separador "Actions" -> "CarinaeOS ISO" -> "Run workflow",
# ou alterar o ficheiro carinae-debian/VERSAO (a versao publicada e o que la estiver).
name: CarinaeOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['carinae-debian/VERSAO']

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Libertar espaco no disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Construir a ISO num Debian 13
        run: |
          docker run --rm --privileged -v "$PWD:/build" -w /build/carinae-debian debian:trixie bash -c '
            apt-get update &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y live-build librsvg2-bin fonts-dejavu-core apt-utils git cmake g++ make python3-numpy python3-pil curl gtk-update-icon-cache ca-certificates &&
            ./construir.sh'

      - name: Dividir e calcular somas
        run: |
          cd carinae-debian
          mv carinaeos-amd64.hybrid.iso CarinaeOS-1.0-amd64.iso
          sha256sum CarinaeOS-1.0-amd64.iso > CarinaeOS-1.0-amd64.iso.sha256
          split -b 1900M -d CarinaeOS-1.0-amd64.iso CarinaeOS-1.0-amd64.iso.parte
          ls -lh

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd carinae-debian
          TAG=carinaeos-v$(head -1 VERSAO | tr -d ' \n')
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && TAG=$TAG-teste-$GITHUB_RUN_NUMBER
          gh release create "$TAG" --title "CarinaeOS ($TAG)" --prerelease \
            --notes-file ../.github/notas-da-versao.md \
            CarinaeOS-1.0-amd64.iso.parte* CarinaeOS-1.0-amd64.iso.sha256

      - name: Deixar só a versão atual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=carinaeos-v$(head -1 carinae-debian/VERSAO | tr -d ' \n')
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && exit 0
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read t; do
            [ "$t" = "$TAG" ] || gh release delete "$t" --yes --cleanup-tag || true
          done
          # etiquetas antigas que ficaram sem lançamento
          git ls-remote --tags origin | awk '{print $2}' | sed 's#refs/tags/##; /\^{}$/d' | while read t; do
            [ "$t" = "$TAG" ] || git push origin --delete "refs/tags/$t" || true
          done
