      else if(view==='inst'){const l=list.filter(a=>S.inst[a.id]);H+=`<h2 style="margin:0 0 12px">Instalados</h2>${l.length?`<div class="sgrid">${l.map(card).join('')}</div>`:`<p style="color:var(--muted)">Nenhum ${isA?'app':'programa'} instalado ainda.</p>`}`}
      else if(view==='search'){const l=list.filter(a=>norm(a.n+' '+a.cat+' '+a.dev).includes(norm(q)));H+=`<h2 style="margin:0 0 12px">Resultados para “${esc(q)}”</h2>${l.length?`<div class="sgrid">${l.map(card).join('')}</div>`:'<p style="color:var(--muted)">Nada encontrado.</p>'}`}
    }
    const st=sb.scrollTop;sb.innerHTML=H;sb.scrollTop=st;
  }
  c.addEventListener('click',e=>{
    const t=e.target;
    const g=t.closest('[data-get]');if(g&&!g.classList.contains('ing')){e.stopPropagation();return install(g.dataset.get)}
    const op=t.closest('[data-open]');if(op){e.stopPropagation();return openApp('x_'+op.dataset.open)}

  win.handle=o=>{if(o.det){det=catFind(o.det);draw()}};win.refresh=draw;draw();
}

function rInstaller(c,win,o){
  const it=o.file||{},a=catFind(it.app),isA=it.k==='apk',plat=isA?'android':'windows';
  win.title(isA?'Instalar app Android':'Instalar programa Windows');
  const name=a?a.n:it.n;
  c.innerHTML=`<div class="inst"><div class="inst-h"><div class="inst-ic">${a?catIcon(a):fileGlyph(it)}</div><div><b>Instalar “${esc(name)}”?</b><small>${!compatOn(plat)?`Os apps ${isA?'Android':'Windows'} estão desativados em Ajustes › Compatibilidade.`:S.inst[a&&a.id]?'Este aplicativo já está instalado.':`${isA?'Este app Android':'Este programa para Windows'} será instalado e aparecerá no Launchpad.`}</small></div></div><div class="prog2"><i></i></div><div class="inst-st"></div><div class="inst-b"><button class="pbtn" data-x>Cancelar</button><button class="pbtn pri" data-ok>${S.inst[a&&a.id]?'Abrir':'Instalar'}</button></div></div>`;
  const ok=$('[data-ok]',c),bar=$('.prog2',c),st=$('.inst-st',c);
  if(!compatOn(plat)){ok.textContent='Ajustes';ok.onclick=()=>{closeWin(win);openApp('settings',{sec:'compat'})}}
  else ok.onclick=()=>{
    if(!a){closeWin(win);return}
    if(S.inst[a.id]){closeWin(win);return openApp('x_'+a.id)}
    install(a.id);ok.disabled=true;bar.style.visibility='visible';
    const steps=isA?['Verificando o pacote…','Instalando…','Otimizando…']:['Preparando…','Copiando arquivos…','Configurando…'];
    const iv=setInterval(()=>{const p=INST[a.id];
      if(p==null&&S.inst[a.id]){clearInterval(iv);$('i',bar).style.width='100%';st.textContent='Concluído.';ok.disabled=false;ok.textContent='Abrir';$('[data-x]',c).textContent='Fechar';return}
      $('i',bar).style.width=(p||0)+'%';st.textContent=steps[Math.min(2,Math.floor((p||0)/34))]},80);
    win.cleanup.push(()=>clearInterval(iv));
  };
  $('[data-x]',c).onclick=()=>closeWin(win);
}

let LOCKED=false;
const relT=t=>{const d=new Date(t),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);const hm=d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString()===n.toDateString())return 'Hoje, '+hm;if(d.toDateString()===y.toDateString())return 'Ontem, '+hm;return d.toLocaleDateString('pt-PT',{day:'numeric',month:'short'}).replace('.','')+', '+hm};
function askIn(c,title,text,okLabel,onOk){

/* ---------- Máquina do Tempo ---------- */
if(!Array.isArray(S.snaps)){const n=Date.now(),H=3600e3;S.snaps=[{t:n-2*H,d:'Automático diário',k:'auto'},{t:n-26*H,d:'Antes da atualização do sistema 0.1.1',k:'upd'},{t:n-50*H,d:'Automático diário',k:'auto'},{t:n-74*H,d:'Instalação do AtriumOS',k:'base'}]}
function snap(desc,k='man'){S.snaps.unshift({t:Date.now(),d:desc,k});S.snaps=S.snaps.slice(0,30);save();refreshAll()}
const SNAP_IC={auto:'clock',upd:'down',inst:'apps',base:'disk',man:'home'};
function rTime(c,win){
  function draw(){
    c.innerHTML=`<div class="tm"><div class="tm-hero">${icon('timemachine')}<div><h2>Máquina do Tempo do sistema</h2><p>Antes de cada atualização ou instalação, o AtriumOS guarda um ponto de restauração. Se algo der errado, é só voltar no tempo. Os seus arquivos pessoais não são afetados.</p></div></div>
    <div class="tm-bar"><button class="pbtn pri" data-a="now">Criar ponto agora</button><button class="pbtn" data-a="img">💾 Criar imagem do sistema…</button><span style="flex:1"></span><span>Automático antes de instalar apps · atualizações do sistema: sempre</span><div class="switch${S.autoSnap?' on':''}" data-sw></div></div>
    <div class="tm-list">${S.snaps.map((s,i)=>`<div class="tm-row"><div class="tm-dot">${s16(SNAP_IC[s.k]||'clock')}</div><div class="tm-m"><b>${relT(s.t)}</b><small>${esc(s.d)}</small></div>${i===0?'<span class="chip">Mais recente</span>':''}<button class="pbtn" data-r="${i}">Restaurar…</button></div>`).join('')}</div>
    <h6 class="ha-h6" style="margin-top:22px">IMAGENS DO SISTEMA · CÓPIA COMPLETA PARA REINSTALAR</h6><div class="grp">${S.images.length?S.images.map((m,i)=>`<div class="row"><span>${m.boot?'🔌':'💾'} ${relT(m.t)} · ${esc(m.dest)}<br><small style="margin:0">${m.size} · AtriumOS ${m.ver||''}${m.boot?' · pen drive inicializável':''}${m.enc?' · 🔒':''}</small></span>${m.boot?`<button class="pbtn" data-ri="${i}">Testar restauração (prévia)</button>`:''}</div>`).join(''):'<div class="row"><small>Nenhuma imagem ainda. Crie uma para poder reinstalar e voltar exatamente a este computador.</small></div>'}</div>
    <p class="tm-foot">Se o sistema não iniciar, escolha <b>“Versão anterior”</b> no menu de inicialização. É o mesmo recurso, antes mesmo de entrar no AtriumOS.</p></div>`;
  }
  c.addEventListener('click',e=>{
    const t=e.target;
    if(t.dataset.a==='img')return openApp('sysimage');
    if(t.dataset.ri!=null)return rescueBoot(S.images[+t.dataset.ri]);
    if(t.dataset.a==='now'){snap('Criado manualmente','man');notify('timemachine','Máquina do Tempo','Ponto de restauração criado.')}
    else if(t.hasAttribute('data-sw')){S.autoSnap=!S.autoSnap;save();draw()}
    else if(t.dataset.r!=null){const s=S.snaps[+t.dataset.r];
      askIn(c,'Restaurar o sistema?',`O AtriumOS volta ao estado de <b>${relT(s.t)}</b> (${esc(s.d)}) e reinicia. Aplicativos instalados depois desse ponto serão removidos. Os seus arquivos pessoais ficam como estão.`,'Restaurar e reiniciar',()=>{
        const later=Object.keys(S.inst).filter(id=>(S.instT||{})[id]>s.t);later.forEach(uninstall);
        S.snaps=S.snaps.filter(x=>x.t<=s.t);save();power('restart');
        setTimeout(()=>notify('timemachine','Sistema restaurado',`O AtriumOS voltou para ${relT(s.t)}.${later.length?' '+later.length+' app(s) removido(s).':''}`),4200)})}
  });
  win.refresh=draw;draw();

  let adq='';
  const adGrid=()=>EXTS.filter(e=>norm(e.n+' '+e.cat).includes(norm(adq))).map(e=>`<div class="ad-c">${extIc(e)}<div><b>${e.n}</b><small>${e.cat}</small><p>${e.d}</p></div>${S.ext[e.id]?`<button class="get" data-xrm="${e.id}">Remover</button>`:`<button class="get" data-addx="${e.id}">Adicionar</button>`}</div>`).join('')||'<p style="color:var(--muted)">Nenhuma extensão encontrada.</p>';
  function openAddons(){const s=S_();const i=s.tabs.findIndex(t=>t.t==='addons');if(i>=0)s.cur=i;else{s.tabs.push({t:'addons'});s.cur=s.tabs.length-1}draw()}
  function extPanel(a){
    const mk=()=>{const ins=EXTS.filter(e=>S.ext[e.id]);const p=h('div','xp',`<h4>Extensões</h4>${ins.length?ins.map(e=>`<div class="xp-r">${extIc(e)}<span class="n">${e.n}</span><span class="xp-pin${S.ext[e.id].pin?' on':''}" data-xpin="${e.id}" title="Fixar na barra">📌</span><div class="switch${S.ext[e.id].on?' on':''}" data-xon="${e.id}"></div></div>`).join(''):'<p style="color:var(--muted);margin:4px 0">Nenhuma extensão instalada.</p>'}<div class="xp-f"><button class="pbtn" data-getx>Gerenciar</button><button class="pbtn pri" data-getx>Obter extensões…</button></div>`);
      p.addEventListener('click',e=>{const d=e.target.dataset;if(d.xpin){S.ext[d.xpin].pin=!S.ext[d.xpin].pin}else if(d.xon){S.ext[d.xon].on=!S.ext[d.xon].on}else if('getx' in d){closeMenu();return openAddons()}else return;save();draw();menuEl.replaceChildren(mk())});return p};
    const r=a.getBoundingClientRect();showMenu(mk(),r.right-320,r.bottom+6)}
  function go(q){if(/^portico:\/\/(ajustes|settings)/i.test(q))return openSettings();if(/^portico:\/\/extens/i.test(q))return openAddons();const t=tab();t.t='ext';t.q=q;const off=S.br.shield==='off',m=S.br.shield==='rigoroso'?1.6:1;t.blk=off?0:Math.round((2+Math.floor(Math.random()*9))*m);BLK.trk+=t.blk;BLK.ads+=off||!S.br.ads?0:Math.floor(Math.random()*5);if(!off&&S.br.fp&&Math.random()<.4)BLK.fp++;draw()}
  function openSettings(sec){if(sec)bsec=sec;const s=S_();const i=s.tabs.findIndex(t=>t.t==='settings');if(i>=0)s.cur=i;else{s.tabs.push({t:'settings'});s.cur=s.tabs.length-1}draw()}
  function brMenu(a){const r=a.getBoundingClientRect();showMenu([{label:'Nova aba',sc:'Ctrl T',action:()=>{S_().tabs.push({t:'home'});S_().cur=S_().tabs.length-1;draw()}},{label:'Nova janela',action:()=>openApp('browser',{newWindow:1})},{label:'Nova janela privada',sc:'Ctrl ⇧ P',action:()=>openApp('browser',{private:1,newWindow:1})},{sep:1},{label:'Favoritos',action:()=>{S.br.bmbar=!S.br.bmbar;save();draw()},check:S.br.bmbar},{label:'Senhas',action:()=>openSettings('senhas')},{label:'Downloads',action:()=>openApp('finder',{folder:'Downloads',newWindow:1})},{label:'Extensões',action:openAddons},{label:'Sincronizar dispositivos',action:()=>openSettings('sync')},{sep:1},{label:'Abas na lateral',check:S.br.vtabs,action:()=>{S.br.vtabs=!S.br.vtabs;save();draw()}},{label:'Limpar dados de navegação…',action:()=>brClearDialog(c)},{sep:1},{label:'Ajustes',sc:'Ctrl ,',action:()=>openSettings()},{label:'Sobre o Pórtico',action:()=>openSettings('sobre')}],r.right-230,r.bottom+6)}
  function shield(el){const p=h('div','shp',`<h4>${SHIELD.replace('<svg','<svg style="width:18px;height:18px;color:#16a34a"')} Escudo do Pórtico</h4><p>Bloqueado nesta sessão, sem extensões:</p><div class="shs"><div><b>${BLK.trk}</b>rastreadores</div><div><b>${BLK.ads}</b>anúncios</div><div><b>${BLK.fp}</b>impressões digitais</div></div><div class="row" style="padding:6px 0;min-height:0"><span>Bloqueio neste site</span><div class="switch on" data-x></div></div><div class="row" style="padding:6px 0;min-height:0"><span>Aceitar só os cookies necessários</span><div class="switch on" data-x></div></div>`);
    p.addEventListener('click',e=>{if(e.target.dataset.x!=null)e.target.classList.toggle('on')});const r=el.getBoundingClientRect();showMenu(p,r.right-300,r.bottom+6)}
  c.addEventListener('click',e=>{const t=e.target;
    const cl=t.closest('[data-close]');if(cl){e.stopPropagation();const i=+cl.dataset.close,s=S_();s.tabs.splice(i,1);if(!s.tabs.length){if(priv)return closeWin(win);s.tabs.push({t:'home'})}s.cur=Math.min(s.cur,s.tabs.length-1);return draw()}
    const tb=t.closest('[data-tab]');if(tb){S_().cur=+tb.dataset.tab;return draw()}
    const g=t.closest('[data-go]');if(g){e.preventDefault();return go(g.dataset.go)}
    const dl=t.closest('[data-dl]');if(dl){const hs=host(tab().q).replace(/\W+/g,'-');return downloadFile(`${hs}-${Math.floor(Math.random()*900+100)}.pdf`,'pdf',dl.getBoundingClientRect())}
    const ax=t.closest('[data-addx]');if(ax){const e=EXTS.find(x=>x.id===ax.dataset.addx);return askIn(c,`Adicionar “${e.n}”?`,'Esta extensão poderá:<br>• ler e alterar dados nos sites que você visita<br>• mostrar notificações<br>• guardar dados neste computador','Adicionar',()=>{S.ext[e.id]={on:true,pin:true};save();draw();notify('browser',e.n+' adicionada','Fixada na barra de ferramentas do Pórtico.')})}
    const xr=t.closest('[data-xrm]');if(xr){delete S.ext[xr.dataset.xrm];save();return draw()}
    const bs=t.closest('[data-bset]');if(bs){const [k,v]=bs.dataset.bset.split(':');if(k==='sec'){bsec=v;draw();$('.bs-main',c)&&($('.bs-main',c).scrollTop=0);return}S.br[k]=v;save();return draw()}
    const bw=t.closest('[data-bsw]');if(bw){const k=bw.dataset.bsw;S.br[k]=!S.br[k];save();if(k==='https'&&S.br[k]===false)notify('browser','Pórtico','Sites sem HTTPS vão abrir sem aviso.');return draw()}
    const bt=t.closest('[data-btb]');if(bt){const k=bt.dataset.btb;S.br.tb[k]=!S.br.tb[k];save();return draw()}
    const ba=t.closest('[data-bact]');if(ba){const [k,v]=ba.dataset.bact.split(/:(.*)/);
      if(k==='clear')return brClearDialog(c);
      if(k==='addons')return openAddons();
      if(k==='reset')return askIn(c,'Restaurar os ajustes do Pórtico?','Os ajustes voltam ao padrão. Favoritos, senhas e extensões não são apagados.','Restaurar',()=>{const site=S.br.site;S.br=JSON.parse(JSON.stringify(BR_DEF));S.br.site=site;S.br.extSites={};save();draw()});
      if(k==='imp')return notify('browser','Importado do '+v,'Favoritos, senhas, histórico e abas já estão no Pórtico.');
      if(k==='rmsite'){delete S.br.site[v];save();return draw()}
      if(k==='send')return notify('browser','Aba enviada','A aba aparece agora em “'+v+'”.');
      if(k==='pwlist')return passPrompt?notify('browser','Senhas','Nesta prévia, a lista de senhas fica protegida pela senha do sistema.'):0;
      if(k==='pwimp')return notify('browser','Importar senhas','Escolha um arquivo CSV exportado do outro navegador ou gerenciador.');
      if(k==='upd')return notify('browser','Pórtico está atualizado','Versão 1.0 · motor Gecko · atualizações automáticas ligadas.');
      if(k==='default')return notify('browser','Navegador padrão','O Pórtico já é o navegador padrão deste computador.');
      if(k==='plat'){const P={win:'Windows: instalador .exe (x64 e ARM) e .msi para empresas.',mac:'macOS: arquivo .dmg universal (Apple Silicon e Intel), assinado.',android:'Android: Google Play, F-Droid ou APK. Extensões funcionam no celular.',linux:'Linux: Flatpak no Flathub, pacotes .deb e .rpm. No AtriumOS já vem instalado.',ios:'iPhone e iPad: em preparação. Fora da UE e do Japão, a Apple obriga todos os navegadores a usar o motor do Safari.'};return notify('browser','Pórtico para '+{win:'Windows',mac:'macOS',android:'Android',linux:'Linux',ios:'iPhone e iPad'}[v],P[v])}
      return}
    const a=t.closest('[data-a]');if(!a)return;const k=a.dataset.a;
    if(k==='ext')return extPanel(a);

  c.addEventListener('input',e=>{if(e.target.classList.contains('ad-s')){adq=e.target.value;$('.ad-g',c).innerHTML=adGrid()}
    if(e.target.dataset.brng){const k=e.target.dataset.brng;S.br[k]=+e.target.value;save();const v=e.target.nextElementSibling;if(v)v.textContent=S.br[k]+'px'}
    if(e.target.classList.contains('bs-find')){const q=norm(e.target.value);$$('.bs-main .row',c).forEach(r=>r.style.display=!q||norm(r.textContent).includes(q)?'':'none')}});

    if(d.bsy){S.br.sy[d.bsy]=e.target.checked;save()}});
  c.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key===','){e.preventDefault();openSettings()}});
  c.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.classList.contains('ad-s'))return;const t=e.target;if((t===url||t.classList.contains('bp-search'))&&t.value.trim()){go(t.value.trim());t.blur()}});

/* ---------- Acesso Remoto ---------- */
const RID='482 913 557';
const genPw=()=>{const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s.slice(0,3)+'-'+s.slice(3)};
const REMOTE={sess:null,pw:genPw()};
if(!Array.isArray(S.rDevs))S.rDevs=[{n:'iPhone',os:'iOS',l:'ontem'},{n:'Galaxy',os:'Android',l:'há 3 dias'}];
const devName=d=>`${d.n} de ${uName()}`;
let rInd=null;
function remoteRequest(i){
  const d=S.rDevs[i];if(!S.remote)return notify('remote','Acesso Remoto','O acesso remoto está desligado.');if(REMOTE.sess)return;
  if(!S.rConfirm)return remoteStart(d);
  const m=h('div','rq',`<div class="rq-b">${icon('remote')}<b>${esc(devName(d))} quer acessar este computador</b><p>Poderá ver a tela e usar o mouse e o teclado. Você pode encerrar a qualquer momento pela barra de menus.</p><div class="rq-btn"><button class="pbtn" data-n>Recusar</button><button class="pbtn pri" data-y>Permitir</button></div></div>`);
  document.body.appendChild(m);$('[data-n]',m).onclick=()=>{m.remove();notify('remote','Acesso Remoto','Conexão recusada.')};$('[data-y]',m).onclick=()=>{m.remove();remoteStart(d)};
}
function remoteStart(d){
  REMOTE.sess={dev:devName(d),t:Date.now()};d.l='agora';save();document.body.classList.add('remote-on');
  rInd=h('div','mb rind',`<i></i>${esc(d.os==='iOS'?'iPhone':'Android')}`);bindMb(rInd,()=>[{head:'Acesso remoto ativo · '+REMOTE.sess.dev},{label:'Encerrar sessão',action:remoteStop},{label:'Abrir Acesso Remoto',action:()=>openApp('remote')}]);
  $('#mb-right').prepend(rInd);refreshAll();notify('remote','Sessão remota iniciada',REMOTE.sess.dev+' está controlando este computador.');
}
function remoteStop(){if(!REMOTE.sess)return;const n=REMOTE.sess.dev;REMOTE.sess=null;document.body.classList.remove('remote-on');if(rInd)rInd.remove();rInd=null;refreshAll();notify('remote','Sessão encerrada',n+' foi desconectado.')}
function rRemote(c,win){
  const sw=(k,on)=>`<div class="switch${on?' on':''}" data-sw="${k}"></div>`;
  const dur=()=>{const s=Math.floor((Date.now()-REMOTE.sess.t)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  function draw(){
    c.innerHTML=`<div class="rm"><div class="rm-top">${icon('remote')}<div><h2>Acesso Remoto</h2><p>Controle este computador pelo celular (Android ou iPhone) ou por outro computador, em casa ou fora dela.</p></div>${sw('remote',S.remote)}</div>
    ${REMOTE.sess?`<div class="rm-live"><i></i><div><b>${esc(REMOTE.sess.dev)} está conectado</b><small>Sessão ativa há <span data-rt>${dur()}</span> · criptografada de ponta a ponta</small></div><button class="pbtn" data-a="stop" style="color:#ff3b30">Encerrar</button></div>`:''}
    <div class="rm-grid${S.remote?'':' off'}"><div class="rm-card"><small>ID deste computador</small><b class="rm-big">${RID}</b><small>Senha temporária</small><div class="rm-pw"><b>${REMOTE.pw}</b><button class="pbtn" data-a="newpw" title="Gerar outra senha">↻ Nova</button></div><small style="margin-top:8px">A senha muda sozinha a cada sessão.</small></div>
      <div class="rm-card rm-qr">${qrSVG()}<small>Aponte a câmera do app no celular</small></div></div>
    <div class="rm-apps"><div><b>🤖 Android</b><small>App Atrium Remoto</small></div><div><b>📱 iPhone e iPad</b><small>App Atrium Remoto</small></div><div><b>💻 Outro computador</b><small>Windows, macOS, Linux ou navegador</small></div></div>
    <div class="grp"><div class="row"><span>Pedir confirmação na tela a cada conexão<br><small>Alguém aqui precisa tocar em “Permitir”</small></span>${sw('rConfirm',S.rConfirm)}</div>
      <div class="row"><span>Acesso fora de casa<br><small>Conexão criptografada, sem abrir portas no roteador</small></span>${sw('rAway',S.rAway)}</div>

  c.addEventListener('click',e=>{const t=e.target,d=t.dataset;
    if(d.sw){S[d.sw]=!S[d.sw];save();if(d.sw==='remote'&&!S.remote)remoteStop();draw()}

const DK_THEMES=[['#312e81','#db2777'],['#0f766e','#22d3ee'],['#fafafa','#e5e7eb'],['#7c2d12','#f59e0b'],['#111827','#374151']];
function rDeck(c,win,o){

  <div class="dk-main"><div class="dk-side"></div><div class="dk-stage"><div class="dk-slide"><h1 contenteditable="true" spellcheck="false"></h1><p contenteditable="true" spellcheck="false"></p></div><div class="dk-notes">Clique no título ou no texto para editar · Notas do apresentador</div></div></div></div>`;
  const side=$('.dk-side',c),sl=$('.dk-slide',c),h1=$('h1',sl),p=$('p',sl);
  const bg=s=>{const t=DK_THEMES[s.th%DK_THEMES.length];return{bg:`linear-gradient(135deg,${t[0]},${t[1]})`,fg:s.th%DK_THEMES.length===2?'#111':'#fff'}};
  function draw(){side.innerHTML=slides.map((s,i)=>{const b=bg(s);return `<div class="dk-th${i===cur?' sel':''}" data-i="${i}"><em>${i+1}</em><div style="background:${b.bg};color:${b.fg}"><b>${esc(s.t)}</b><span>${esc(s.s.split('\n')[0]||'')}</span></div></div>`}).join('');
    const s=slides[cur],b=bg(s);sl.style.background=b.bg;sl.style.color=b.fg;h1.textContent=s.t;p.innerText=s.s}
  h1.addEventListener('input',()=>{slides[cur].t=h1.textContent;side.querySelector('.sel b').textContent=h1.textContent});
  p.addEventListener('input',()=>{slides[cur].s=p.innerText;side.querySelector('.sel span').textContent=p.innerText.split('\n')[0]});
  function play(){let i=cur;const ov=h('div','dk-show');document.body.appendChild(ov);
    const show=()=>{const s=slides[i],b=bg(s);ov.innerHTML=`<div class="dk-full" style="background:${b.bg};color:${b.fg}"><h1>${esc(s.t)}</h1><p>${esc(s.s).replace(/\n/g,'<br>')}</p></div><div class="dk-cnt">${i+1} / ${slides.length} · ← → para navegar · Esc para sair</div>`;ov.firstChild.animate([{opacity:0,transform:'scale(.97)'},{opacity:1,transform:'none'}],{duration:AD(350),easing:'ease-out'})};
    const key=e=>{if(e.key==='Escape'){end();e.stopImmediatePropagation()}else if(['ArrowRight',' ','Enter','PageDown'].includes(e.key)){if(i<slides.length-1){i++;show()}else end()}else if(['ArrowLeft','PageUp'].includes(e.key)&&i>0){i--;show()}};
    const end=()=>{document.removeEventListener('keydown',key,true);ov.remove()};
    ov.addEventListener('click',()=>{if(i<slides.length-1){i++;show()}else end()});document.addEventListener('keydown',key,true);show()}
  c.addEventListener('click',e=>{const th=e.target.closest('[data-i]');if(th){cur=+th.dataset.i;return draw()}const d=e.target.closest('[data-d]');if(!d)return;
    if(d.dataset.d==='new'){slides.splice(cur+1,0,{t:'Novo slide',s:'Clique para adicionar texto',th:slides[cur].th});cur++;draw();h1.focus()}
    if(d.dataset.d==='theme'){slides.forEach(s=>s.th=(s.th+1)%DK_THEMES.length);draw()}
    if(d.dataset.d==='del'&&slides.length>1){slides.splice(cur,1);cur=Math.max(0,cur-1);draw()}

function mkDi(id,cls=''){
  const nb=id==='settings'&&typeof updCount==='function'?updCount():0;
  const d=h('div','di'+cls,`<div class="lbl">${id==='downloads'?'Downloads':APPS[id].n}</div><div class="ic">${id==='downloads'?stackIcon():icon(id)}</div><div class="dot"></div>${nb?`<span class="badge">${nb}</span>`:''}`);d.dataset.id=id;

function resetMag(){for(const id in dockItems){const ic=dockItems[id].ic;ic.style.width=ic.style.height=''}}
function poof(x,y){const p=h('div','poof','<i></i><i></i><i></i><i></i><i></i>');p.style.left=x+'px';p.style.top=y+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),700)}
function dockInsertIndex(x){const kids=[...dock.children],s1=kids.findIndex(k=>k.classList.contains('dsep'));const pinned=kids.slice(0,s1).filter(k=>!k.classList.contains('dragging'));let idx=pinned.length;for(let i=0;i<pinned.length;i++){const r=pinned[i].getBoundingClientRect();if(x<r.left+r.width/2){idx=i;break}}return{idx,pinned,sep:kids[s1]}}
function dockDragStart(e,id,d){
  if(e.button!==0||id==='trash'||id==='downloads')return;const sx=e.clientX,sy=e.clientY;let ghost=null;
  const outOf=ev=>ev.clientY<dock.getBoundingClientRect().top-45;
  const mv=ev=>{
    if(!ghost){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<7)return;dockDragging=true;dockSuppress=true;ghost=h('div','dock-ghost',icon(id));document.body.appendChild(ghost);d.classList.add('dragging');dock.classList.add('nomag');resetMag()}
    ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
    const out=outOf(ev)&&id!=='finder';ghost.classList.toggle('rmv',out);d.style.display=out?'none':'';
    if(!out){const {idx,pinned,sep}=dockInsertIndex(ev.clientX);const ref=pinned[idx]||sep;if(ref&&ref!==d&&d.nextSibling!==ref)dock.insertBefore(d,ref);else if(!ref)dock.insertBefore(d,sep)}
  };
  const up=ev=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);if(!ghost)return;
    ghost.remove();d.classList.remove('dragging');dock.classList.remove('nomag');dockDragging=false;
    if(outOf(ev)&&id!=='finder'){poof(ev.clientX,ev.clientY);DOCK=DOCK.filter(x=>x!==id)}
    else{const kids=[...dock.children],s1=kids.findIndex(k=>k.classList.contains('dsep'));DOCK=kids.slice(0,s1).map(k=>k.dataset.id).filter(Boolean)}
    saveDock();buildDock();setTimeout(()=>{dockSuppress=false},60)};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
}

function removeFromDock(id){if(id==='finder')return;const d=dockItems[id];if(d){const r=d.el.getBoundingClientRect();poof(r.left+r.width/2,r.top)}DOCK=DOCK.filter(x=>x!==id);saveDock();buildDock()}
function lpDragStart(e,k,el){

  const mv=ev=>{if(!ghost){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return;ghost=h('div','dock-ghost',icon(k));document.body.appendChild(ghost);el.classList.add('lp-drag');lp.classList.add('dragging')}
    ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';const over=ev.clientY>dock.getBoundingClientRect().top-30;dock.classList.toggle('drop',over)};

    if(ev.clientY>dock.getBoundingClientRect().top-30){addToDock(k,dockInsertIndex(ev.clientX).idx);notify(k,APPS[k].n,'Adicionado à Dock.')}};

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  const inField=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if(e.key==='F3'||(e.ctrlKey&&!e.altKey&&e.key==='ArrowUp'&&!inField)){e.preventDefault();toggleMC();return}
  if(e.key==='Escape'&&stackEl){closeStack();return}
  if(e.key==='Escape'&&MC){toggleMC(false);return}
  if(e.key==='Escape'&&NC){toggleNC(false);return}
  if(e.key==='Escape'&&SHOWD){toggleDesk(false);return}
  if(e.ctrlKey&&!e.altKey&&!inField&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();switchSpace(SPC+(e.key==='ArrowRight'?1:-1));return}
  if(e.ctrlKey&&e.altKey&&/^Arrow/.test(e.key)){e.preventDefault();tile(focused,{ArrowLeft:'L',ArrowRight:'R',ArrowUp:'F',ArrowDown:'C'}[e.key]);return}
  if(e.code==='Space'&&(((e.ctrlKey||e.metaKey)&&S.skCtrl)||(e.altKey&&!e.ctrlKey&&S.skAlt))){e.preventDefault();toggleSpot();return}
  if(e.ctrlKey&&e.altKey&&(e.key==='l'||e.key==='L')){e.preventDefault();lock();return}
  if(e.key==='F4'){e.preventDefault();toggleLP();return}
  if(e.key==='Escape'){if(spot.classList.contains('open'))return toggleSpot(false);if(lp.classList.contains('open'))return toggleLP(false);if(menuEl)return closeMenu()}
  if(spot.classList.contains('open')||$('#lock').classList.contains('open'))return;
  const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
  if(focused&&focused.onkey)focused.onkey(e);

  window.favRede=(nome,caminho)=>{const host=(caminho.match(/server=([^,]+)/)||[])[1];const share=(caminho.match(/share=([^,]+)$/)||caminho.match(/share=([^,]+)/)||[])[1];
    const url=host&&share?`smb://${host}/${share}`:'';if(!url)return notify('finder','Favoritos','Só pastas compartilhadas da rede.');
    if(!S.netFavs.some(f=>f.url===url)){S.netFavs.push({nome,url});save()}notify('finder','Favoritos',`“${nome}” está nos Favoritos e vai reconectar sozinho.`);refreshAll()};
  /* reconecta os favoritos ao entrar */
  setTimeout(()=>S.netFavs.forEach(f=>sysCall('rede_conectar',{url:f.url}).then(r=>{if(r.ok){FS[f.nome]=r.itens||[];if(!NET.mounted.some(m=>m.n===f.nome))NET.mounted.push({n:f.nome,dev:f.url});renderDesk()}})),4000);

  /* ---------- Home Assistant: retorno visual, estados e agente (sensores e botões no seu HA) ---------- */
  let AG={agente:false,estado:'desligado'};
  const agEst=async()=>{const r=await sysCall('ha_agente',{acao:'estado'});if(r&&r.ok)AG=r;return AG};agEst();
  window.haExec=async(id,btn)=>{if(btn){btn.disabled=true;btn.textContent='…'}
    const r=await sysCall('ha',{acao:'executar',entidade:id});
    if(btn){btn.textContent=r.ok?'✓ Feito':'✕ Falhou';btn.style.color=r.ok?'#16a34a':'#ff3b30'}
    notify('settings','Home Assistant',r.ok?'Comando enviado ao Home Assistant.':'O Home Assistant não aceitou: '+(r.erro||''));
    setTimeout(()=>{if(window.haRecarregar)haRecarregar()},1200)};
  window.agLigar=async()=>{$('#ag-msg').textContent='Conectando…';const r=await sysCall('ha_agente',{acao:'ligar',host:$('#ag-host').value,usuario:$('#ag-u').value,senha:$('#ag-p').value});AG=r;refreshAll();
    notify('settings','Home Assistant',r.estado==='conectado'?`Pronto: “${r.dispositivo}” já aparece no seu Home Assistant (Ajustes › Dispositivos › MQTT).`:(r.erro||'Não foi possível conectar ao MQTT.'))};
  window.agDesligar=async()=>{AG=await sysCall('ha_agente',{acao:'desligar'});refreshAll()};
  const _haHTML4=haSettingsHTML;
  haSettingsHTML=function(sw){
    let H=_haHTML4(sw);
    H=H.replace(/onclick="haExec\('([^']+)'\)"/g,`onclick="haExec('$1',this)"`);
    /* estado ligado/desligado em cor */
    H=H.replace(/ · (on|off|unavailable)<\/small>/g,(m,e)=>` · <b style="color:${e==='on'?'#16a34a':e==='off'?'#8e8e93':'#ff9f0a'}">${e==='on'?'ligado':e==='off'?'desligado':'indisponível'}</b></small>`);
    const ag=`<h3 class="sec" style="font-size:14px">Este computador no Home Assistant</h3><div class="grp">
      ${AG.agente&&AG.estado==='conectado'?`<div class="row"><span>${esc(AG.dispositivo)}<br><small><span style="color:#16a34a">●</span> Conectado ao MQTT (${esc(AG.host)}) · sensores de CPU, memória, disco, volume e janela ativa; botões Desligar, Reiniciar, Bloquear, Apagar a tela, Repouso e Silenciar; avisos na tela</small></span><button class="pbtn" onclick="agDesligar()">Desligar</button></div>
        <div class="row"><small>No Home Assistant: Configurações › Dispositivos e serviços › MQTT › “${esc(AG.dispositivo)}”.</small></div>`:
      `<div class="row" style="display:block"><p style="margin:0 0 8px;font-size:13px">Faz o computador aparecer no seu Home Assistant como dispositivo, com sensores e botões (desligar, reiniciar, bloquear, apagar a tela). Usa o MQTT (complemento “Mosquitto broker” do Home Assistant).</p>
        <label style="font-size:12.5px">Servidor MQTT<input id="ag-host" class="srch" style="width:100%;margin:4px 0 8px" value="${esc(AG.host||'')}" placeholder="192.168.1.50"></label>
        <label style="font-size:12.5px">Usuário MQTT<input id="ag-u" class="srch" style="width:100%;margin:4px 0 8px" value="${esc(AG.usuario||'')}" placeholder="um usuário do Home Assistant"></label>
        <label style="font-size:12.5px">Senha MQTT<input id="ag-p" type="password" class="srch" style="width:100%;margin:4px 0 8px"></label>
        <small>Com o Mosquitto do Home Assistant, use o login de um usuário do próprio Home Assistant.</small>
        <div style="display:flex;gap:10px;align-items:center;margin-top:10px"><button class="pbtn pri" onclick="agLigar()">Conectar</button><small id="ag-msg" style="color:#ff9f0a">${esc(AG.erro||'')}</small></div></div>`}
      <div class="row"><small>🔊 Como caixa de som: o computador aparece sozinho no Home Assistant como “AtriumOS (${esc(NETR.host||'')})” em Configurações › Dispositivos e serviços › Descobertos (DLNA). Também aparece como player no Music Assistant.</small></div></div>`;
    return H.includes('id="ha-url"')?H:H+ag};
  window.haRecarregar=()=>sysCall('ha',{acao:'estado'}).then(()=>refreshAll());

  /* ---------- Música: Music Assistant ---------- */
  APPS.music.r=function(c,win){
    let E={conectado:null,jogadores:[]},sel=null,res=null,busca='',carregando=false;
    const jog=()=>E.jogadores.find(j=>j.id===sel)||E.jogadores[0];
    const estado=async()=>{const r=await sysCall('ma',{acao:'estado'});if(r&&r.ok){E=r;if(!sel&&E.jogadores&&E.jogadores[0])sel=E.jogadores[0].id}else if(r)E.erro=r.erro;draw()};
    const capa=u=>u?`<img src="${esc(u)}" style="width:100%;height:100%;object-fit:cover;border-radius:8px" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
    const grade=(t,l)=>l&&l.length?`<h6 class="ha-h6">${t}</h6><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px">${l.map(i=>`<div data-uri="${esc(i.uri)}" style="cursor:pointer"><div style="aspect-ratio:1;background:rgba(127,127,127,.18);border-radius:8px;display:grid;place-items:center;font-size:28px">${capa(i.imagem)||'♪'}</div><div style="font-size:12.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(i.nome)}</div><small style="opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${esc(i.artistas||'')}</small></div>`).join('')}</div>`:'';
    const draw=()=>{
      if(E.conectado===null){c.innerHTML='<div style="padding:24px">Conectando ao Music Assistant…</div>';return}
      if(!E.conectado){c.innerHTML=`<div style="padding:26px;max-width:520px"><h2 style="margin-top:0">Music Assistant</h2><p>Conecte o seu servidor Music Assistant para ouvir as suas músicas (Spotify, Tidal, rádios, arquivos…) neste computador ou em qualquer caixa de som da casa.</p>
        <label style="font-size:12.5px">Endereço do servidor<input id="ma-url" class="srch" style="width:100%;margin:4px 0 10px" placeholder="http://192.168.1.50:8095" value="${esc(E.sugestao||'')}"></label>
        <label style="font-size:12.5px">Token de acesso<input id="ma-tok" type="password" class="srch" style="width:100%;margin:4px 0 6px" placeholder="Cole aqui o token"></label>
        <small>No Music Assistant: Configurações › Usuários (ou Segurança) › criar um token.</small>
        <div style="display:flex;gap:10px;align-items:center;margin-top:12px"><button class="pbtn pri" data-a="conectar">Conectar</button><small id="ma-msg" style="color:#ff9f0a">${esc(E.erro||'')}</small></div></div>`;return}
      const j=jog(),t=j&&j.tocando;
      c.innerHTML=`<div style="display:flex;flex-direction:column;height:100%"><div style="padding:10px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border)">
          <input class="srch" data-q placeholder="Buscar músicas, álbuns, artistas, rádios…" value="${esc(busca)}" style="flex:1">
          <select class="srch" data-j style="max-width:220px">${E.jogadores.map(p=>`<option value="${esc(p.id)}"${j&&p.id===j.id?' selected':''}>${p.esteComputador?'💻 ':'🔊 '}${esc(p.nome)}</option>`).join('')}</select></div>
        <div style="flex:1;overflow:auto;padding:6px 16px 16px">${carregando?'<p>Carregando…</p>':''}${res?['tracks','albums','playlists','artists','radio'].map(k=>grade({tracks:'Músicas',albums:'Álbuns',playlists:'Playlists',artists:'Artistas',radio:'Rádios'}[k],res[k])).join('')||'<p>Nada encontrado.</p>':''}
          ${!E.jogadores.some(p=>p.esteComputador)?'<p style="font-size:12px;opacity:.75">Este computador ainda não apareceu como player no Music Assistant. Ele é anunciado sozinho na rede (Squeezelite); confira se o provedor “Squeezelite” está ligado no Music Assistant.</p>':''}</div>
        <div style="padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center">
          <div style="width:44px;height:44px;background:rgba(127,127,127,.2);border-radius:8px;flex:none">${t?capa(t.imagem):''}</div>
          <div style="flex:1;min-width:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t&&t.nome?esc(t.nome):'Nada tocando'}</div><small style="opacity:.7">${t?esc(t.artistas||''):''}${j?' · '+esc(j.nome):''}</small></div>
          <button class="pbtn" data-a="previous">⏮</button><button class="pbtn" data-a="play_pause">${j&&j.estado==='playing'?'⏸':'▶︎'}</button><button class="pbtn" data-a="next">⏭</button>
          <input type="range" min="0" max="100" value="${j&&j.volume!=null?j.volume:50}" data-v style="width:110px"></div></div>`;
      const q=$('[data-q]',c);q.addEventListener('keydown',async e=>{e.stopPropagation();if(e.key==='Enter'){busca=q.value;carregando=true;draw();const r=await sysCall('ma',{acao:'buscar',texto:busca});carregando=false;res=r.ok?r.resultados:null;if(!r.ok)notify('music','Música',r.erro||'Erro na busca');draw()}});
      $('[data-j]',c).onchange=e=>{sel=e.target.value;draw()};
      $('[data-v]',c).onchange=e=>{const j2=jog();if(j2)sysCall('ma',{acao:'volume',jogador:j2.id,volume:+e.target.value})}};
    c.addEventListener('click',async e=>{const a=e.target.closest('[data-a]'),u=e.target.closest('[data-uri]');
      if(a&&a.dataset.a==='conectar'){$('#ma-msg').textContent='Conectando…';const r=await sysCall('ma',{acao:'conectar',url:$('#ma-url').value,token:$('#ma-tok').value});if(!r.ok){$('#ma-msg').textContent=r.erro;return}estado();biblioteca();return}
      const j=jog();if(!j)return;
      if(a&&['previous','play_pause','next'].includes(a.dataset.a)){await sysCall('ma',{acao:a.dataset.a,fila:j.fila});setTimeout(estado,600)}
      if(u){notify('music','Música',`Tocando em ${j.nome}…`);const r=await sysCall('ma',{acao:'tocar',fila:j.fila,uri:u.dataset.uri});if(!r.ok)notify('music','Música',r.erro||'Não foi possível tocar.');setTimeout(estado,1500)}});
    const biblioteca=async()=>{const r=await sysCall('ma',{acao:'biblioteca'});if(r&&r.ok&&!res){res=r.resultados;draw()}};
    draw();sysCall('ma',{acao:'estado'}).then(async r=>{E=r||{conectado:false};if(!E.conectado){const d=await sysCall('ma',{acao:'descobrir'});E.sugestao=d&&d.url||''}else{if(E.jogadores[0])sel=E.jogadores[0].id;biblioteca()}draw()});
    const iv=setInterval(()=>{if(E.conectado)estado()},5000);win.cleanup.push(()=>clearInterval(iv))};
}

if(REAL){let margemAnt=-1;setInterval(()=>{const d=$('#dock');if(!d)return;const r=d.getBoundingClientRect();const auto=document.body.classList.contains('dockauto')||S.dockAuto||S.autohide;const px=auto?0:Math.max(0,Math.round(window.innerHeight-r.top)+4);if(px!==margemAnt&&px<300){margemAnt=px;sysCall('margem_dock',{px})}},3000)}
/* ---------- interface por cima das janelas reais quando é preciso (menus, Launchpad, Busca, bloqueio, janelas do AtriumOS) ---------- */
if(REAL){
  let elevada=false,ultimoReal=0,ultimoHtml=Date.now();
  window.marcarReal=()=>{ultimoReal=Date.now()};
  document.addEventListener('mousedown',e=>{if(e.target.closest('.win'))ultimoHtml=Date.now()},true);
  const precisaTopo=()=>{
    if($('#lock').classList.contains('open')||$('#setup')&&$('#setup').classList.contains('open')||$('#power').classList.contains('open'))return true;
    if($('#launchpad').classList.contains('open')||$('#spotlight').classList.contains('open')||document.body.classList.contains('ncopen')||(typeof MC!=='undefined'&&MC))return true;
    if($('.menu')||$('.rq')||$('.modal'))return true;
    const htmlAbertas=wins.some(w=>w.el&&w.el.isConnected&&!w.min&&w.el.style.display!=='none');
    return htmlAbertas&&ultimoHtml>ultimoReal};
  setInterval(()=>{const q=!!precisaTopo();if(q!==elevada){elevada=q;sysCall('elevar',{on:q})}},250);
  const _oa6=openApp;openApp=function(id,o={}){const r=_oa6(id,o);if(window.REAL_APPS_IDS&&REAL_APPS_IDS.includes(id)||['loja','chrome'].includes(id))ultimoReal=Date.now();else if(APPS[id]&&APPS[id].r)ultimoHtml=Date.now();return r};
  const _of6=openFile;openFile=function(it,f){const r=_of6(it,f);if(it&&it.caminho&&it.k!=='folder')ultimoReal=Date.now();return r};
  /* avisos aparecem por cima das janelas quando a interface está no fundo */
  const _nt6=notify;notify=function(app,title,body){if(!elevada&&!S.focus){sysCall('notificar',{titulo:title,texto:body})}return _nt6(app,title,body)};
}
/* ---------- init ---------- */
document.body.classList.toggle('dark',S.dark);
drawArches();setWall(S.wall);setAccent(S.accent);applyDock();applyBright();applyLite();if(S.stage){STAGE=true;document.body.classList.add('stage')}
Object.keys(S.inst).forEach(id=>{if(catFind(id))regApp(id);else delete S.inst[id]});
buildDock();buildRight();renderMenubar();renderDesk();(S.mounts||[]).forEach(m=>mountShare(m.n,m.dev,true));tick();setInterval(tick,1000);battery();
boot();
</script>
</body>
