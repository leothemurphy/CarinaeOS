<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1356"/>
      <stop offset="0.55" stop-color="#16092e"/>
      <stop offset="1" stop-color="#3a0f3f"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb46e" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ff6fa8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nucleo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fff1d6"/>
      <stop offset="0.7" stop-color="#ffb46e"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="feixe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#c9a6ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="onda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf8f"/>
      <stop offset="1" stop-color="#ff6fa8"/>
    </linearGradient>
  </defs>
  <!-- fundo: céu escuro, cantos redondos -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#fundo)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <!-- estrelinhas -->
  <g fill="#ffffff">
    <circle cx="52" cy="62" r="2.2" opacity="0.8"/>
    <circle cx="206" cy="58" r="1.6" opacity="0.6"/>
    <circle cx="198" cy="196" r="2" opacity="0.7"/>
    <circle cx="60" cy="200" r="1.4" opacity="0.5"/>
    <circle cx="170" cy="40" r="1.2" opacity="0.5"/>
  </g>
  <!-- aura -->
  <circle cx="128" cy="128" r="104" fill="url(#aura)"/>
  <!-- os dois feixes do pulsar (em diagonal) -->
  <g transform="rotate(-35 128 128)">
    <path d="M128 118 L236 88 L236 168 L128 138 Z" fill="url(#feixe)"/>
    <path d="M128 118 L236 88 L236 168 L128 138 Z" fill="url(#feixe)" transform="rotate(180 128 128)"/>
  </g>
  <!-- ondas de som -->
  <g fill="none" stroke="url(#onda)" stroke-linecap="round">
    <path d="M 98 92 A 48 48 0 0 0 98 164" stroke-width="11" opacity="1"/>
    <path d="M 158 92 A 48 48 0 0 1 158 164" stroke-width="11" opacity="1"/>
    <path d="M 76 70 A 80 80 0 0 0 76 186" stroke-width="8" opacity="0.6"/>
    <path d="M 180 70 A 80 80 0 0 1 180 186" stroke-width="8" opacity="0.6"/>
  </g>
  <!-- núcleo -->
  <circle cx="128" cy="128" r="40" fill="url(#nucleo)"/>
  <circle cx="128" cy="128" r="14" fill="#ffffff"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
