# CarinaeOS — atalhos de teclado (lidos pela Gravidade; para aplicar: a Gravidade relê com "kill -HUP")
#
#   Combinação = ação
#   Modificadores: Super, Alt, Ctrl, Shift.  "Super" sozinho = tocar só na tecla Super.
#   Ação: um comando qualquer, ou uma ação da Gravidade (começa por @):
#     @lancador @tarefa N @alternar @alternar-inverso @fechar @maximizar @minimizar
#     @repor-ou-minimizar @esquerda @direita @zona 1|2|3 (25/50/25) @tela-cheia @mostrar-mesa
#     @area N @area-anterior @area-seguinte @levar-area-anterior @levar-area-seguinte @recarregar
#   Teclas especiais: Return Tab Escape Space Left Right Up Down PgUp PgDown Print F1..F12
#     VolumeUp VolumeDown Mute MicMute Play Next Prev BrightnessUp BrightnessDown PowerOff Sleep

Super = @lancador
Alt+F1 = @lancador
Alt+Tab = @alternar
Alt+Shift+Tab = @alternar-inverso
Alt+F4 = @fechar
Super+Up = @maximizar
Super+PgUp = @maximizar
Super+Down = @repor-ou-minimizar
Super+PgDown = @minimizar
Super+Left = @esquerda
Super+Right = @direita
Super+Alt+1 = @zona 1
Super+Alt+2 = @zona 2
Super+Alt+3 = @zona 3
Super+F = @tela-cheia
Super+D = @mostrar-mesa
Super+Ctrl+Left = @area-anterior
Super+Ctrl+Right = @area-seguinte
Super+Ctrl+Shift+Left = @levar-area-anterior
Super+Ctrl+Shift+Right = @levar-area-seguinte
Super+Ctrl+Escape = xkill
Super+L = carinae-sessao bloquear
Super+E = xdg-open "$HOME"
Super+Return = x-terminal-emulator
Ctrl+Alt+T = x-terminal-emulator
Ctrl+Space = carinaeos-comando
Print = carinae-captura regiao
Shift+Print = carinae-captura
Alt+Print = carinae-captura janela
Calculator = carinaeos-calculadora
Super+period = carinaeos-emojis
VolumeUp = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
VolumeDown = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
Mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
MicMute = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
Play = playerctl play-pause
Next = playerctl next
Prev = playerctl previous
Super+1 = @tarefa 1
Super+2 = @tarefa 2
Super+3 = @tarefa 3
Super+4 = @tarefa 4
Super+5 = @tarefa 5
Super+6 = @tarefa 6
Super+7 = @tarefa 7
Super+8 = @tarefa 8
Super+9 = @tarefa 9
# o botão de ligar do computador (o que faz escolhe-se em Energia)
PowerOff = carinae-energia --botao
Sleep = carinae-sessao suspender
