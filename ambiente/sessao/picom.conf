# CarinaeOS — compositor (picom). Copia para ~/.config/carinaeos/picom.conf para mudar.
backend = "glx";
vsync = true;
use-damage = true;
# jogos e vídeos em ecrã inteiro sem passar pelo compositor (mais rápido na NVIDIA)
unredir-if-possible = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.42;
shadow-offset-x = -16;
shadow-offset-y = -12;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'carinae-shell'",
    "_GTK_FRAME_EXTENTS@",
    "_NET_WM_STATE@[*] = '_NET_WM_STATE_HIDDEN'"
];

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 5;

corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'tooltip'",
    "class_g = 'carinae-shell'",
    "_NET_WM_STATE@[*] = '_NET_WM_STATE_FULLSCREEN'"
];

detect-client-opacity = true;
detect-transient = true;
