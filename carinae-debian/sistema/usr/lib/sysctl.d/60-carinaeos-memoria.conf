# CarinaeOS: com a swap na memória (zram), trocar para lá é mais barato do que reler do disco;
# a documentação do kernel diz que para zram/zswap podem considerar-se valores acima de 100.
vm.swappiness = 150
# a zram não ganha nada com a leitura antecipada da swap (é memória, não um disco)
vm.page-cluster = 0
