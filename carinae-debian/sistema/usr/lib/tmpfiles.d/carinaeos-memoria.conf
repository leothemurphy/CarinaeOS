# CarinaeOS: a proteção do kernel contra travamentos (Multi-Gen LRU, "thrashing prevention"):
# o que foi usado no último segundo não é descartado da memória. Segundo os autores, 1000 ms
# eliminam normalmente os engasgos intoleráveis da interface quando a memória aperta.
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
