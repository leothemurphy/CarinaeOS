# CarinaeOS: o mpd usa io_uring para ler as músicas, e enquanto espera nele o kernel
# (até à versão 6.14) conta essa espera como "à espera do disco": uma tarefa sempre
# bloqueada e ~40-50% de pressão de disco falsa, que esconde a verdadeira e engana as
# medições. Sem io_uring o mpd lê os arquivos da forma normal, sem diferença no som.
[Service]
SystemCallFilter=~io_uring_setup io_uring_enter io_uring_register
SystemCallErrorNumber=ENOSYS
