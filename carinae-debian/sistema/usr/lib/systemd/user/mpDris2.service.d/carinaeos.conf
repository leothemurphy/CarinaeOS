# CarinaeOS: a ponte MPRIS (mpDris2) só existe enquanto o mpd está ligado.
#  - Requisite: não arranca sozinha se o mpd estiver desligado. Antes, sem o mpd, ela ficava 90 s à
#    espera do nome no D-Bus e atrasava a abertura da sessão, repetindo a cada minuto e meio.
#  - PartOf: desliga junto com o mpd; quem a liga é o próprio mpd (Wants=, em mpd.service.d).
#  - Type=simple: não espera pelo D-Bus (o mpDris2 só pega o nome depois de falar com o mpd).
[Unit]
After=mpd.service
Requisite=mpd.service
PartOf=mpd.service

[Service]
Type=simple
Restart=on-failure
RestartSec=5
