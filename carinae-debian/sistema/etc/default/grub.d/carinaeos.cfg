# CarinaeOS - menu de arranque
GRUB_DISTRIBUTOR="CarinaeOS"
GRUB_TIMEOUT=3
# Sem o Plymouth (splash): com a NVIDIA 470 e noutras placas o Plymouth não devolvia a consola e o
# ecrã de entrada ficava preto para sempre (Xorg parado em vt_waitactive). O arranque fica limpo e sem cursor.
GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=3 plymouth.enable=0 vt.global_cursor_default=0"
# a imagem do GRUB passa para o sistema na resolução certa (a consola deixa de ficar em 800x600)
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_BACKGROUND="/usr/share/carinaeos/grub.png"
GRUB_GFXMODE=auto
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="white/dark-gray"
