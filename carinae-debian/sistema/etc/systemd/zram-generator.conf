# CarinaeOS: memória comprimida (zram), como o macOS e o Windows já fazem de fábrica.
# Quando a memória aperta, o que está parado é comprimido aqui em vez de o kernel descartar o
# código dos programas e ter de o reler do disco (o que trava a Dock e as janelas, sobretudo em HD).
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
